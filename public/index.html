<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Gitgit</title>
  <link rel="stylesheet" href="/agen/vendor/xterm.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #10140f;
      --card: #1a2118;
      --line: #2c3828;
      --text: #e7f0df;
      --muted: #9aab90;
      --accent: #b6e36a;
      --warn: #e2b15a;
      --hot: #e07a62;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(1200px 500px at 10% -10%, #24321c, var(--bg));
      color: var(--text);
    }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.03em; }
    h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .sub { color: var(--muted); margin: 6px 0 22px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    form { display: grid; gap: 12px; max-width: 380px; }
    label { font-size: 0.9rem; color: var(--muted); }
    input, .path-input {
      width: 100%;
      border: 1px solid var(--line);
      background: #121812;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 650;
      background: var(--accent);
      color: #17210d;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.small { padding: 8px 12px; font-size: 0.88rem; }
    .error { color: var(--hot); min-height: 1.2em; }
    .top { display: flex; justify-content: space-between; gap: 16px; align-items: end; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .metric strong { display: block; font-size: 1.6rem; margin-top: 8px; }
    .metric span, .muted { color: var(--muted); }
    .bar { height: 8px; border-radius: 99px; background: #2a3326; margin-top: 12px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
    .bar.warm i { background: var(--warn); }
    .bar.hot i { background: var(--hot); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
    th { color: var(--muted); font-weight: 600; }
    section { margin-top: 12px; }
    .hidden { display: none !important; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 12px; }
    .tabs button.active { background: var(--accent); color: #17210d; }
    .term-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #0d120c; }
    .term-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: #1a2118; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
    .term-body { height: 520px; padding: 8px; }
    .term-title { font-weight: 600; color: var(--accent); }
    .term-btn { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 0.85rem; cursor: pointer; }
    .term-btn:hover { background: var(--card); }
    .files-toolbar, .term-toolbar, .crumb-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }
    .crumb-row { overflow-x: auto; }
    .crumb {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      font-size: 0.88rem;
    }
    .crumb button {
      background: transparent;
      color: var(--accent);
      border: 0;
      padding: 2px 4px;
      font-weight: 600;
    }
    .crumb span { color: var(--muted); }
    .files-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
    .file-row { cursor: pointer; }
    .file-row:hover td { background: #222c1e; }
    .file-row.active td { background: #2a3822; }
    .name-cell { display: flex; gap: 8px; align-items: center; word-break: break-all; }
    .icon { width: 1.2em; text-align: center; }
    .preview {
      min-height: 240px;
      max-height: 520px;
      overflow: auto;
      background: #121812;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
    }
    .preview img { max-width: 100%; border-radius: 8px; }
    #term {
      height: min(62vh, 620px);
      background: #0d120c;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      overflow: hidden;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--hot); display: inline-block; }
    .status-dot.on { background: var(--accent); }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .files-layout { grid-template-columns: 1fr; }
      .top { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <section id="login" class="card">
      <h1>Dashboard Gitgit</h1>
      <p class="sub">Masuk untuk melihat pemakaian server, folder, dan terminal.</p>
      <form id="login-form">
        <label for="password">Kata sandi</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Masuk</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>

    <section id="dash" class="hidden">
      <div class="top">
        <div>
          <h1 id="host">Server</h1>
          <p class="sub" id="meta">Memuat…</p>
        </div>
        <button id="logout" class="ghost" type="button">Keluar</button>
      </div>
      <nav class="tabs">
        <button class="ghost active" type="button" data-tab="overview">Ringkasan</button>
        <button class="ghost" type="button" data-tab="files">Folder</button>
        <button class="ghost" type="button" data-tab="terminal">Terminal</button>
      </nav>

      <div id="tab-overview">
        <div class="grid">
          <article class="card metric"><span>CPU</span><strong id="cpu">—</strong><div class="bar" id="cpu-bar"><i></i></div></article>
          <article class="card metric"><span>RAM</span><strong id="ram">—</strong><div class="bar" id="ram-bar"><i></i></div><p class="muted" id="ram-detail"></p></article>
          <article class="card metric"><span>Swap</span><strong id="swap">—</strong><p class="muted" id="swap-detail"></p></article>
          <article class="card metric"><span>Load</span><strong id="load">—</strong><p class="muted" id="uptime"></p></article>
        </div>
        <section class="card">
          <h2>Penyimpanan</h2>
          <table>
            <thead><tr><th>Mount</th><th>Terpakai</th><th>Kosong</th><th>Total</th><th>%</th></tr></thead>
            <tbody id="disks"></tbody>
          </table>
        </section>
        <section class="card">
          <h2>Jaringan</h2>
          <table>
            <thead><tr><th>Antarmuka</th><th>Unduh</th><th>Unggah</th></tr></thead>
            <tbody id="net"></tbody>
          </table>
        </section>
      </div>

      <div id="tab-files" class="hidden">
        <section class="card">
          <form class="files-toolbar" id="path-form">
            <input class="path-input" id="path-input" name="path" spellcheck="false" />
            <button class="small" type="submit">Buka</button>
            <button class="ghost small" id="go-home" type="button">Home</button>
            <button class="ghost small" id="go-root" type="button">/</button>
            <button class="ghost small" id="go-up" type="button">Naik</button>
          </form>
          <div class="crumb-row">
            <div class="crumb" id="crumb"></div>
          </div>
          <p id="files-error" class="error"></p>
          <div class="files-layout">
            <div>
              <input id="file-filter" placeholder="Saring nama…" />
              <div style="overflow:auto; max-height: 560px;">
                <table>
                  <thead><tr><th>Nama</th><th>Ukuran</th><th>Diubah</th></tr></thead>
                  <tbody id="files"></tbody>
                </table>
              </div>
            </div>
            <div>
              <div class="files-toolbar">
                <strong id="preview-title">Pratinjau</strong>
                <button class="ghost small" id="download-btn" type="button">Unduh</button>
                <button class="ghost small" id="open-term-btn" type="button">Buka di terminal</button>
              </div>
              <div class="preview" id="preview">Pilih folder atau berkas.</div>
            </div>
          </div>
        </section>
      </div>

      <div id="tab-terminal" class="hidden">
        <section class="card">
          <div class="term-toolbar">
            <button class="ghost small" id="term-new" type="button">+ Terminal baru</button>
            <button class="ghost small" id="term-reconnect" type="button">Sambungkan ulang</button>
          </div>
          <div id="term-container" style="display:flex;flex-direction:column;gap:8px;"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="/agen/vendor/xterm.js"></script>
  <script src="/agen/vendor/xterm-addon-fit.js"></script>
  <script>
    const base = "/agen";
    const login = document.querySelector("#login");
    const dash = document.querySelector("#dash");
    const loginError = document.querySelector("#login-error");
    let homePath = "/home/gitgitmiko";
    let currentPath = homePath;
    let currentParent = null;
    let entries = [];
    let selectedPath = "";
    let timer = 0;
    let pendingCd = "";
    let terminals = {};
    let restorePromise = null;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function fmtBytes(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const v = Number(n) || 0;
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      let x = v;
      while (x >= 1024 && i < units.length - 1) { x /= 1024; i += 1; }
      return `${x.toFixed(x >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
    }
    function fmtDuration(sec) {
      const s = Math.floor(sec);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      return `${d} hari ${h} jam ${m} menit`;
    }
    function setBar(id, percent) {
      const bar = document.querySelector(id);
      const value = Math.max(0, Math.min(100, percent));
      bar.querySelector("i").style.width = `${value}%`;
      bar.classList.toggle("warm", value >= 70 && value < 90);
      bar.classList.toggle("hot", value >= 90);
    }
    function show(authed) {
      login.classList.toggle("hidden", authed);
      dash.classList.toggle("hidden", !authed);
    }
    function iconFor(type) {
      if (type === "dir") return "📁";
      if (type === "link") return "🔗";
      return "📄";
    }
    function shellQuote(s) {
      return `'${String(s).replace(/'/g, `'\\''`)}'`;
    }
    function fileUrl(path, download) {
      return `${base}/api/fs/file?path=${encodeURIComponent(path)}${download ? "&download=1" : ""}`;
    }

    function showTab(name) {
      document.querySelectorAll(".tabs button").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === name));
      document.querySelector("#tab-overview").classList.toggle("hidden", name !== "overview");
      document.querySelector("#tab-files").classList.toggle("hidden", name !== "files");
      document.querySelector("#tab-terminal").classList.toggle("hidden", name !== "terminal");
      if (name === "files" && !entries.length) loadFiles(currentPath);
      if (name === "terminal") {
        ensureTerminals().then(() => {
          const ids = Object.keys(terminals);
          const visibleIds = ids.filter((id) => terminals[id] && !terminals[id].minimized);
          const last = visibleIds.length ? visibleIds[visibleIds.length - 1] : ids[ids.length - 1];
          requestAnimationFrame(() => {
            if (last && terminals[last]?.fitAddon) {
              terminals[last].fitAddon.fit();
              sendResizeFor(last);
            }
          });
        });
      }
    }

    async function paint() {
      const res = await fetch(`${base}/api/stats`, { cache: "no-store" });
      if (res.status === 401) { show(false); detachAllTerminals(); return; }
      const data = await res.json();
      if (data.home) homePath = data.home;
      document.querySelector("#host").textContent = data.hostname || "Server";
      document.querySelector("#meta").textContent = new Date(data.time).toLocaleString("id-ID");
      document.querySelector("#cpu").textContent = `${data.cpu.percent.toFixed(1)}%`;
      setBar("#cpu-bar", data.cpu.percent);
      document.querySelector("#ram").textContent = `${data.memory.percent.toFixed(1)}%`;
      document.querySelector("#ram-detail").textContent = `${fmtBytes(data.memory.used)} / ${fmtBytes(data.memory.total)}`;
      setBar("#ram-bar", data.memory.percent);
      const swapPct = data.memory.swap_total ? (data.memory.swap_used / data.memory.swap_total) * 100 : 0;
      document.querySelector("#swap").textContent = data.memory.swap_total ? `${swapPct.toFixed(1)}%` : "Tidak ada";
      document.querySelector("#swap-detail").textContent = data.memory.swap_total ? `${fmtBytes(data.memory.swap_used)} / ${fmtBytes(data.memory.swap_total)}` : "";
      document.querySelector("#load").textContent = `${data.load.one.toFixed(2)}`;
      document.querySelector("#uptime").textContent = `1 / 5 / 15 mnt: ${data.load.one.toFixed(2)} · ${data.load.five.toFixed(2)} · ${data.load.fifteen.toFixed(2)} · hidup ${fmtDuration(data.uptime_sec)}`;
      document.querySelector("#disks").innerHTML = data.disks.map((d) => `<tr><td>${esc(d.mount)}</td><td>${fmtBytes(d.used)}</td><td>${fmtBytes(d.avail)}</td><td>${fmtBytes(d.size)}</td><td>${d.percent}%</td></tr>`).join("");
      document.querySelector("#net").innerHTML = data.network.map((n) => `<tr><td>${esc(n.name)}</td><td>${fmtBytes(n.rx_bps)}/dtk</td><td>${fmtBytes(n.tx_bps)}/dtk</td></tr>`).join("") || "<tr><td colspan='3'>Tidak ada antarmuka</td></tr>";
    }

    function renderCrumb(path) {
      const parts = path.split("/").filter(Boolean);
      let acc = "";
      const bits = [`<button type="button" data-path="/">/</button>`];
      for (const part of parts) {
        acc += `/${part}`;
        bits.push(`<span>/</span><button type="button" data-path="${esc(acc)}">${esc(part)}</button>`);
      }
      document.querySelector("#crumb").innerHTML = bits.join("");
    }

    function renderFiles() {
      const q = document.querySelector("#file-filter").value.trim().toLowerCase();
      const rows = entries.filter((e) => !q || e.name.toLowerCase().includes(q));
      document.querySelector("#files").innerHTML = rows.map((e) => `
        <tr class="file-row ${e.path === selectedPath ? "active" : ""}" data-path="${esc(e.path)}" data-type="${esc(e.type)}">
          <td class="name-cell"><span class="icon">${iconFor(e.type)}</span>${esc(e.name)}</td>
          <td>${e.type === "dir" ? "—" : fmtBytes(e.size)}</td>
          <td>${e.mtime ? new Date(e.mtime).toLocaleString("id-ID") : "—"}</td>
        </tr>
      `).join("") || `<tr><td colspan="3">Folder kosong</td></tr>`;
    }

    async function loadFiles(path) {
      const filesError = document.querySelector("#files-error");
      filesError.textContent = "";
      const res = await fetch(`${base}/api/fs?path=${encodeURIComponent(path)}`, { cache: "no-store" });
      if (res.status === 401) { show(false); return; }
      const data = await res.json();
      if (!res.ok) {
        filesError.textContent = data.message || "Gagal membaca folder";
        return;
      }
      currentPath = data.path;
      currentParent = data.parent;
      entries = data.entries || [];
      document.querySelector("#path-input").value = currentPath;
      renderCrumb(currentPath);
      renderFiles();
      if (data.truncated) filesError.textContent = "Daftar dipotong karena terlalu banyak berkas.";
    }

    async function previewFile(path, type) {
      selectedPath = path;
      renderFiles();
      const box = document.querySelector("#preview");
      const title = document.querySelector("#preview-title");
      title.textContent = path;
      if (type === "dir") {
        box.textContent = `Folder ${path}`;
        return;
      }
      const res = await fetch(`${base}/api/fs/preview?path=${encodeURIComponent(path)}`, { cache: "no-store" });
      const data = await res.json();
      if (!res.ok) {
        box.textContent = data.message || "Tidak bisa dibuka";
        return;
      }
      if (data.type === "image") {
        box.innerHTML = `<img alt="${esc(data.name)}" src="${fileUrl(path, false)}" />`;
        return;
      }
      if (data.type === "binary") {
        box.textContent = `Berkas biner (${fmtBytes(data.size)}). Unduh untuk membukanya.`;
        return;
      }
      box.textContent = `${data.truncated ? `[Pratinjau dipotong]\n\n` : ""}${data.content || ""}`;
    }

    function begin() {
      show(true);
      paint();
      if (!timer) timer = setInterval(paint, 3000);
      restoreTerminals();
    }

    function b64ToUint8(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    function wsUrl(serverId) {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const q = serverId ? `?id=${encodeURIComponent(serverId)}` : "";
      return `${proto}://${location.host}${base}/ws/terminal${q}`;
    }

    function sendResizeFor(id) {
      const row = terminals[id];
      if (!row?.term || !row.ws || row.ws.readyState !== WebSocket.OPEN) return;
      row.ws.send(JSON.stringify({ type: "resize", cols: row.term.cols, rows: row.term.rows }));
    }

    function sendToTerm(text, id) {
      const trySend = (row) => row?.ws && row.ws.readyState === WebSocket.OPEN && (row.ws.send(text), true);
      if (id && trySend(terminals[id])) return;
      for (const row of Object.values(terminals)) {
        if (trySend(row)) return;
      }
    }

    function openInTerminal(path) {
      pendingCd = path;
      showTab("terminal");
      const ids = Object.keys(terminals);
      const targetId = ids.length ? ids[ids.length - 1] : null;
      if (targetId) sendToTerm(`cd ${shellQuote(path)}\n`, targetId);
    }

    function detachTerminal(id) {
      const row = terminals[id];
      if (!row) return;
      row.dead = true;
      if (row.reconnectTimer) { clearTimeout(row.reconnectTimer); row.reconnectTimer = 0; }
      if (row.ws) {
        row.ws.onclose = null;
        row.ws.onerror = null;
        row.ws.onmessage = null;
        try { row.ws.close(); } catch { /* ignore */ }
        row.ws = null;
      }
      if (row.term) {
        try { row.term.dispose(); } catch { /* ignore */ }
        row.term = null;
      }
      if (row.card) row.card.remove();
      delete terminals[id];
    }

    function detachAllTerminals() {
      for (const id of Object.keys(terminals)) detachTerminal(id);
    }

    function closeTerminal(id) {
      if (!id) {
        detachAllTerminals();
        return;
      }
      const row = terminals[id];
      if (!row) return;
      row.dead = true;
      if (row.reconnectTimer) { clearTimeout(row.reconnectTimer); row.reconnectTimer = 0; }
      const serverId = row.serverId;
      if (row.ws && row.ws.readyState === WebSocket.OPEN) {
        try { row.ws.send(JSON.stringify({ type: "close" })); } catch { /* ignore */ }
      }
      if (serverId) {
        fetch(`${base}/api/terminals/${encodeURIComponent(serverId)}`, { method: "DELETE" }).catch(() => {});
      }
      detachTerminal(id);
    }

    function restoreTerminals() {
      if (!restorePromise) {
        restorePromise = (async () => {
          try {
            const res = await fetch(`${base}/api/terminals`, { cache: "no-store" });
            if (res.status === 401) {
              show(false);
              return;
            }
            const data = await res.json().catch(() => ({}));
            for (const item of data.terminals || []) openTerminal(item.id, item.title);
          } catch {
            /* ignore */
          }
        })().finally(() => {
          restorePromise = null;
        });
      }
      return restorePromise;
    }

    async function ensureTerminals() {
      await restoreTerminals();
      if (!Object.keys(terminals).length) openTerminal();
    }

    function connectTerminalWs(id) {
      const row = terminals[id];
      if (!row || row.dead) return;
      if (row.ws && (row.ws.readyState === WebSocket.OPEN || row.ws.readyState === WebSocket.CONNECTING)) return;
      if (row.reconnectTimer) { clearTimeout(row.reconnectTimer); row.reconnectTimer = 0; }
      setTermStatusFor(id, false, "Menyambung…");
      const ws = new WebSocket(wsUrl(row.serverId || ""));
      ws.binaryType = "arraybuffer";
      row.ws = ws;
      ws.onopen = () => {
        if (row.fitAddon) row.fitAddon.fit();
      };
      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") {
          let msg = null;
          try { msg = JSON.parse(ev.data); } catch { row.term?.write(ev.data); return; }
          if (msg.type === "session") {
            row.serverId = msg.id;
            if (msg.title && row.titleEl) row.titleEl.textContent = msg.title;
            row.term.reset();
            if (msg.replay) row.term.write(b64ToUint8(msg.replay));
            setTermStatusFor(id, true, "Tersambung");
            row.fitAddon?.fit();
            sendResizeFor(id);
            if (pendingCd) {
              ws.send(`cd ${shellQuote(pendingCd)}\n`);
              pendingCd = "";
            }
            return;
          }
          if (msg.type === "gone" || msg.type === "exit") {
            row.dead = true;
            setTermStatusFor(id, false, msg.type === "exit" ? "Shell selesai" : "Sesi hilang");
            try { ws.close(); } catch { /* ignore */ }
            return;
          }
          if (msg.type === "error") {
            setTermStatusFor(id, false, msg.message || "Gagal");
            return;
          }
          return;
        }
        if (ev.data instanceof ArrayBuffer) row.term.write(new Uint8Array(ev.data));
        else row.term.write(ev.data);
      };
      ws.onclose = () => {
        if (row.ws === ws) row.ws = null;
        if (row.dead) return;
        setTermStatusFor(id, false, "Menyambung ulang…");
        row.reconnectTimer = setTimeout(() => connectTerminalWs(id), 1000);
      };
      ws.onerror = () => {
        if (!row.dead) setTermStatusFor(id, false, "Menyambung ulang…");
      };
    }

    function openTerminal(serverId, title) {
      if (serverId && Object.values(terminals).some((row) => row.serverId === serverId)) return serverId;
      const id = serverId || `pending-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
      const container = document.querySelector("#term-container");
      const card = document.createElement("div");
      card.className = "term-card";
      card.id = `card-${id}`;
      const label = title || (serverId ? "Terminal" : "Terminal baru");
      card.innerHTML = `
        <div class="term-header">
          <span class="status-dot" id="dot-${id}"></span>
          <span class="term-title" id="title-${id}">${esc(label)}</span>
          <span class="term-status" id="status-${id}" style="font-size:0.8rem;color:var(--muted);">Menyambung…</span>
          <div>
            <button class="term-btn" data-term-act="min" data-term-id="${esc(id)}" type="button">Minimize</button>
            <button class="term-btn" data-term-act="max" data-term-id="${esc(id)}" type="button">Maximize</button>
            <button class="term-btn" data-term-act="close" data-term-id="${esc(id)}" type="button">Tutup</button>
          </div>
        </div>
        <div class="term-body" id="body-${id}"></div>`;
      container.appendChild(card);

      const termDiv = document.createElement("div");
      termDiv.id = `term-${id}`;
      document.querySelector(`#body-${id}`).appendChild(termDiv);

      const t = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
        scrollback: 5000,
        theme: { background: "#0d120c", foreground: "#e7f0df", cursor: "#b6e36a", selectionBackground: "#3a4d30" },
      });
      const addon = new FitAddon.FitAddon();
      t.loadAddon(addon);
      t.open(termDiv);
      t.onData((data) => {
        const row = terminals[id];
        if (row?.ws && row.ws.readyState === WebSocket.OPEN) row.ws.send(data);
      });

      terminals[id] = {
        card,
        term: t,
        fitAddon: addon,
        ws: null,
        minimized: false,
        dead: false,
        serverId: serverId || "",
        reconnectTimer: 0,
        titleEl: document.querySelector(`#title-${id}`),
        bodyDiv: document.querySelector(`#body-${id}`),
      };
      connectTerminalWs(id);
      return id;
    }

        document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";
      const body = new URLSearchParams(new FormData(event.currentTarget));
      const res = await fetch(`${base}/login`, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
      if (!res.ok) {
        loginError.textContent = "Kata sandi salah";
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (data.home) {
        homePath = data.home;
        currentPath = data.home;
      }
      begin();
    });
    document.querySelector("#logout").addEventListener("click", async () => {
      await fetch(`${base}/logout`, { method: "POST" });
      if (timer) { clearInterval(timer); timer = 0; }
      detachAllTerminals();
      show(false);
    });
    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => showTab(btn.dataset.tab));
    });
    document.querySelector("#path-form").addEventListener("submit", (event) => {
      event.preventDefault();
      loadFiles(document.querySelector("#path-input").value.trim() || homePath);
    });
    document.querySelector("#go-home").addEventListener("click", () => loadFiles(homePath));
    document.querySelector("#go-root").addEventListener("click", () => loadFiles("/"));
    document.querySelector("#go-up").addEventListener("click", () => {
      if (currentParent) loadFiles(currentParent);
    });
    document.querySelector("#file-filter").addEventListener("input", renderFiles);
    document.querySelector("#crumb").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-path]");
      if (btn) loadFiles(btn.dataset.path);
    });
    document.querySelector("#files").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-path]");
      if (!row) return;
      if (row.dataset.type === "dir") loadFiles(row.dataset.path);
      else previewFile(row.dataset.path, row.dataset.type);
    });
    document.querySelector("#download-btn").addEventListener("click", () => {
      if (!selectedPath) return;
      location.href = fileUrl(selectedPath, true);
    });
    document.querySelector("#open-term-btn").addEventListener("click", () => {
      openInTerminal(selectedPath || currentPath);
    });
    document.querySelector("#term-reconnect").addEventListener("click", () => {
      for (const id of Object.keys(terminals)) {
        const row = terminals[id];
        if (!row || row.dead) continue;
        if (row.ws && (row.ws.readyState === WebSocket.OPEN || row.ws.readyState === WebSocket.CONNECTING)) continue;
        connectTerminalWs(id);
      }
    });

    function minimizeTerminal(id) {
      if (!terminals[id]) return;
      terminals[id].minimized = true;
      const body = document.querySelector(`#body-${id}`);
      if (!body) return;
      body.style.visibility = "hidden";
      body.style.height = "0";
      body.style.padding = "0";
    }
    function maximizeTerminal(id) {
      if (!terminals[id]) return;
      terminals[id].minimized = false;
      const body = document.querySelector(`#body-${id}`);
      if (body) {
        body.style.visibility = "visible";
        body.style.height = "520px";
        body.style.padding = "8px";
      }
      terminals[id].fitAddon?.fit();
      sendResizeFor(id);
    }
    function setTermStatusFor(id, on, text) {
      const dot = document.querySelector(`#dot-${id}`);
      const status = document.querySelector(`#status-${id}`);
      if (dot) dot.classList.toggle("on", on);
      if (status) status.textContent = text;
    }
    document.querySelector("#term-container").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-term-act]");
      if (!btn) return;
      const id = btn.dataset.termId;
      if (btn.dataset.termAct === "min") minimizeTerminal(id);
      if (btn.dataset.termAct === "max") maximizeTerminal(id);
      if (btn.dataset.termAct === "close") closeTerminal(id);
    });
    document.querySelector("#term-new").addEventListener("click", () => {
      openTerminal();
      showTab("terminal");
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      for (const id of Object.keys(terminals)) {
        const row = terminals[id];
        if (!row || row.dead) continue;
        if (!row.ws || row.ws.readyState === WebSocket.CLOSED || row.ws.readyState === WebSocket.CLOSING) {
          connectTerminalWs(id);
        } else {
          row.fitAddon?.fit();
          sendResizeFor(id);
        }
      }
    });

(async () => {
      try {
        const session = await fetch(`${base}/api/session`, { cache: "no-store" });
        const data = await session.json().catch(() => ({}));
        if (data.home) {
          homePath = data.home;
          currentPath = data.home;
        }
        if (session.ok) begin();
        else show(false);
      } catch {
        show(false);
      }
    })();
  </script>
</body>
</html>
